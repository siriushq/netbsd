on:
  # twice a day at 6am and 6pm UTC
  schedule:
    - cron: "0 6,18 * * *"
  # manual dispatch
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: fetch upstream /netbsd/src
        run: |
          echo "First run: cloning full NetBSD src"
          git clone --mirror https://github.com/netbsd/src.git netbsd-src

      - name: configure identity for git, and restore workflow file to master
        run: |
          git config --global user.name "siriushq-aggregate[bot]"
          git config --global user.email "siriushq-aggregate[bot]@users.noreply.github.com"

          cp .github/workflows/mirror.yml /tmp/mirror.yml

          git remote add upstream netbsd-src
          git fetch upstream
          git checkout -B master upstream/master

          mkdir -p .github/workflows
          cp /tmp/mirror.yml .github/workflows/mirror.yml

          git add .github/workflows/mirror.yml
          git commit -m $'restore workflow

          Co-authored-by: Mahied Maruf <contact@mechite.com>
          Co-authored-by: Enzo van der Tuin <enzo.van.der.tuin@siriushq.org>
          Signed-off-by: siriushq-aggregate <siriushq-aggregate[bot]@users.noreply.github.com>'

      - name: force push to master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin HEAD:master --force
